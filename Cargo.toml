[package]
name = "gitwatch-rust"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A live, read-only terminal viewer for Git working-tree changes"
license = "MIT"
repository = "https://github.com/arturo/gitwatch-rust"

[[bin]]
name = "gitwatch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
notify = "8.2"
pulldown-cmark = "0.13"
ratatui = "0.29"
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
